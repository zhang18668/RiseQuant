data:
  qlib_data_dir: "./qlib_data/cn_data"
  cache_dir: "./data/cache"
  # 阶段 1.x 缓存目录（与 scripts/build_*_cache.py 默认值保持一致）
  zt_pool_cache_dir: "./data/zt_pool_cache"
  daily_cache_dir: "./data/daily_cache"
  verify_dir: "./data/verify"
  # 通达信本地数据目录（Windows 路径，请根据本机修改）
  tdx_vipdoc: "C:/new_tdx/vipdoc"
  start_date: "2020-01-01"
  end_date: "2026-05-21"

event:
  limit_up_threshold: 9.9
  exclude_st: true
  second_board_days: 5
  main_wave_days: 10
  main_wave_return: 0.15

feature:
  pre_trend_window_1m: 20
  pre_trend_window_2m: 40
  use_technical: true
  use_market: true
  price_volume:
    returns_n: [1, 3, 5, 10, 20]
    volume_rolling_n: [5, 10]
    ma_n: [20, 60, 120]
    volatility_n: [5, 10]
  limit_up:
    history_days: [20, 60]

model:
  type: "lightgbm"
  params:
    num_leaves: 15
    learning_rate: 0.01
    n_estimators: 300
    n_jobs: -1
    min_child_samples: 50
    feature_fraction: 0.6
    bagging_fraction: 0.6
    bagging_freq: 3
    lambda_l1: 0.2
    lambda_l2: 0.2
    max_depth: 5
    min_split_gain: 0.1
    verbose: -1

dataset:
  split_method: "date"
  test_ratio: 0.2
  valid_ratio: 0.1
  train_end: "2022-12-31"
  valid_end: "2023-06-30"
  test_end: "2023-12-31"
  purged_kfold_embargo_days: 10
  model_dir: "./models"

backtest:
  start_date: "2024-01-06"
  end_date: "2024-12-31"
  initial_cash: 10000000
  benchmark: "SH000300"
  topk: 3
  sell_n: 5
  slippage: 0.003
  entry_delay: 1
  min_score: 0.62
  stop_loss: 0.03
  take_profit: 0.08
  trailing_stop: 0.04
  skip_zhangting_open: true
  cooldown_after_stop: 5

  # Search execution parameters and select the Sharpe-first result.
  optimize: true
  optimize_grid:
    min_score_grid: [0.58, 0.60, 0.62, 0.65, 0.68, 0.70]
    topk_grid: [1, 2, 3]
    sell_n_grid: [2, 3, 5]
    trailing_stop_grid: [0.03, 0.04]
    take_profit_grid: [0.0, 0.08]
    cooldown_after_stop_grid: [5]
    min_sells: 20
