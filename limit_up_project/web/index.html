<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RiseQuant 策略研究</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <h1>RiseQuant</h1>
        <p>涨停后分歧确认策略研究</p>
      </div>

      <label class="field">
        <span>研究结果</span>
        <select id="modelSelect"></select>
      </label>

      <div id="modelMeta" class="meta"></div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <h2>初始形态与加因子筛选</h2>
          <p id="statusText">正在加载本地研究结果...</p>
        </div>
        <div class="toolbar">
          <label>
            <span>日期</span>
            <select id="dateSelect"></select>
          </label>
          <label>
            <span>展示</span>
            <select id="modeSelect">
              <option value="all">全部形态</option>
              <option value="selected">加因子入选</option>
              <option value="candidate">仅初始未选</option>
            </select>
          </label>
          <label>
            <span>最多行数</span>
            <input id="topInput" type="number" min="20" max="2000" step="20" value="500" />
          </label>
          <button id="refreshBtn" class="primary">刷新</button>
        </div>
      </header>

      <section class="summary-grid">
        <div class="summary-card">
          <span>当前展示</span>
          <strong id="shownCount">-</strong>
        </div>
        <div class="summary-card selected">
          <span>加因子入选</span>
          <strong id="selectedCount">-</strong>
        </div>
        <div class="summary-card">
          <span>初始未选</span>
          <strong id="candidateCount">-</strong>
        </div>
        <div class="summary-card hit">
          <span>次日触达 3%</span>
          <strong id="hitCount">-</strong>
        </div>
      </section>

      <section class="panel">
        <div class="section-title">
          <h3>股票明细</h3>
          <span>绿色标记表示添加因子后最终选择</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>日期 T</th>
                <th>股票</th>
                <th>状态</th>
                <th>T-2 涨停</th>
                <th>T-1 分歧</th>
                <th>T 收盘价</th>
                <th>T 涨幅</th>
                <th>T 最高涨幅</th>
                <th>T+1</th>
                <th>是否触达 3%</th>
                <th>T+1 最高涨幅</th>
                <th>T+1 收盘收益率</th>
                <th>卖出价</th>
                <th>每股盈亏</th>
                <th>T-1 换手</th>
                <th>T-1 放量倍数</th>
                <th>T-2 量比5</th>
              </tr>
            </thead>
            <tbody id="researchBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
